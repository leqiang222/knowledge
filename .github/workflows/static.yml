# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["llq/develop"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
     # 新增步骤1：安装依赖（如果项目需要构建，如npm项目）
      - name: 安装Node.js依赖
        uses: actions/setup-node@v4
        with:
          node-version: 18  # 根据你的项目版本调整
          cache: 'npm'      # 缓存依赖加速构建

      # 新增步骤2：执行打包命令（根据你的项目实际命令修改）
      - name: 构建项目
        run: |
          npm install   # 安装依赖（如果需要）
          npm run build # 执行打包，生成dist等文件夹

      # 修改步骤：指定上传打包后的文件夹（关键修改）
      - name: 上传打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 替换为你的打包文件夹路径（如dist、build、public等）
          path: './docs/.vuepress/dist'

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
